name: cryoid-training
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # Suggested compatibility environment, not a recovered historical lockfile.
      # The original scripts use CUDA AMP and the older checkpoint-loading API.
      - torch==2.5.1
      - numpy==1.26.4
      - matplotlib>=3.8,<3.10
      - pandas>=2.1,<2.3
      - scipy>=1.11,<1.15
      - gemmi>=0.6.7,<0.8
      - mrcfile>=1.5.4,<2
      - requests>=2.32.3,<3
      - tqdm>=4.66,<5
      - split-folders==0.5.1
      - torchsummary==1.5.1
