[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryoid-struct-fetch-new-method"
version = "0.1.0"
description = "Standalone StructFetch candidate discovery, rawfield alignment, and benchmark Q-score tooling."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gemmi",
    "matplotlib",
    "mrcfile",
    "numpy",
    "pandas",
    "parasail",
    "requests",
    "scipy",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["aligner", "benchmark", "benchmark_gt_only", "cases", "config_io", "fetch", "inputs", "io_utils", "map_utils", "paths", "pipeline", "plot_qscore", "qscore", "rawfield", "run_logging"]
