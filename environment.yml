name: cryoid
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - pip
  - blast
  # Install compiled dependencies through Conda so setup also works on
  # older Linux hosts where current PyPI wheels require a newer glibc.
  - biopython>=1.81,<2
  - gemmi>=0.6.7,<0.8
  - matplotlib>=3.7.5,<4
  - mrcfile>=1.5.4,<2
  - numpy>=1.23.5,<3
  - pandas>=1.5.3,<4
  - requests>=2.32.3,<3
  - scikit-learn>=1.3.2,<2
  - scipy>=1.10.1,<2
  - pytorch>=1.11,<3
  - tomli>=2,<3
  - pytest>=8.3.5,<10
  - pyqt6>=6.7,<7
  - pip:
      - -e .[gui,dev]
