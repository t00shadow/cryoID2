name: cryoid
channels:
  - conda-forge
  - bioconda  # [unix]
  - nodefaults
dependencies:
  - python=3.11
  - pip
  # Install compiled dependencies through Conda so setup also works on
  # older Linux hosts where current PyPI wheels require a newer glibc.
  # The setup helper selects this native package only on Linux/macOS.
  # Windows installs the Parasail pip wheel with CryoID below.
  - parasail-python=1.3.4  # [unix]
  - biopython>=1.81,<2
  - gemmi>=0.6.7,<0.8
  - matplotlib>=3.7.5,<4
  - mrcfile>=1.5.4,<2
  # NumPy 1.x also works with the final Intel macOS PyPI PyTorch wheel.
  - numpy>=1.26.4,<2
  - pandas>=1.5.3,<4
  - packaging>=23.2,<27
  - requests>=2.32.3,<3
  - scikit-learn>=1.3.2,<2
  - scipy>=1.10.1,<2
  - pytorch>=2.2.2,<3
  - threadpoolctl>=3.1,<4
  - pytest>=8.3.5,<10
  - pyqt6>=6.7,<7
  - pip:
      - -e .[gui,dev]
